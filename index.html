<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Live Captions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            min-height: 100vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        .caption-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .caption-box {
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 40px;
            border-radius: 8px;
            max-width: 90%;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
        }

        .caption-box.show {
            opacity: 1;
            transform: translateY(0);
        }

        .caption-text {
            font-size: 2.5em;
            line-height: 1.4;
            color: #ffffff;
            font-weight: 600;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            letter-spacing: 0.5px;
        }

        /* Status indicator (small, top-right corner) */
        .status-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9em;
            color: white;
            z-index: 1000;
            opacity: 0.6;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #95a5a6;
        }

        .status-dot.listening {
            background: #e74c3c;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-dot.ready {
            background: #2ecc71;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Error message */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(231, 76, 60, 0.9);
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 2000;
        }

        /* Settings overlay (hidden by default, show with ?settings in URL) */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            color: white;
            padding: 40px;
        }

        .settings-overlay.show {
            display: flex;
        }

        .settings-content {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
        }

        .settings-content h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .setting-item {
            margin-bottom: 20px;
        }

        .setting-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .setting-item select,
        .setting-item input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            background: rgba(255, 255, 255, 0.9);
        }

        .setting-item input[type="range"] {
            background: transparent;
        }

        .btn {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-start {
            background: #2ecc71;
            color: white;
        }

        .btn-start:hover {
            background: #27ae60;
        }

        .btn-close {
            background: #95a5a6;
            color: white;
        }

        .btn-close:hover {
            background: #7f8c8d;
        }

        .value-display {
            text-align: right;
            font-size: 0.9em;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="caption-container">
        <div class="caption-box" id="captionBox">
            <div class="caption-text" id="captionText"></div>
        </div>
    </div>

    <div class="status-indicator" id="statusIndicator">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Initializing...</span>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-content">
            <h2>🎤 Caption Settings</h2>
            
            <div class="setting-item">
                <label for="languageSelect">Language:</label>
                <select id="languageSelect">
                    <option value="en-US">English (US)</option>
                    <option value="en-GB">English (UK)</option>
                    <option value="es-ES">Spanish</option>
                    <option value="fr-FR">French</option>
                    <option value="de-DE">German</option>
                    <option value="it-IT">Italian</option>
                    <option value="pt-BR">Portuguese (Brazil)</option>
                    <option value="ja-JP">Japanese</option>
                    <option value="ko-KR">Korean</option>
                    <option value="zh-CN">Chinese (Mandarin)</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="fontSizeRange">
                    Font Size: <span class="value-display" id="fontSizeValue">2.5em</span>
                </label>
                <input type="range" id="fontSizeRange" min="1.5" max="4" step="0.1" value="2.5">
            </div>

            <div class="setting-item">
                <label for="bgOpacityRange">
                    Background Opacity: <span class="value-display" id="bgOpacityValue">85%</span>
                </label>
                <input type="range" id="bgOpacityRange" min="0" max="100" step="5" value="85">
            </div>

            <div class="setting-item">
                <label for="maxWidthRange">
                    Max Width: <span class="value-display" id="maxWidthValue">90%</span>
                </label>
                <input type="range" id="maxWidthRange" min="50" max="100" step="5" value="90">
            </div>

            <button class="btn btn-start" id="startBtnSettings">Start Captions</button>
            <button class="btn btn-close" id="closeBtnSettings">Close Settings</button>
        </div>
    </div>

    <script>
        // Check browser support
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            showError('Your browser does not support Speech Recognition. Please use Google Chrome.');
        }

        // Initialize Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        // Get elements
        const captionBox = document.getElementById('captionBox');
        const captionText = document.getElementById('captionText');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const errorMessage = document.getElementById('errorMessage');
        const settingsOverlay = document.getElementById('settingsOverlay');

        // Settings elements
        const languageSelect = document.getElementById('languageSelect');
        const fontSizeRange = document.getElementById('fontSizeRange');
        const fontSizeValue = document.getElementById('fontSizeValue');
        const bgOpacityRange = document.getElementById('bgOpacityRange');
        const bgOpacityValue = document.getElementById('bgOpacityValue');
        const maxWidthRange = document.getElementById('maxWidthRange');
        const maxWidthValue = document.getElementById('maxWidthValue');
        const startBtnSettings = document.getElementById('startBtnSettings');
        const closeBtnSettings = document.getElementById('closeBtnSettings');

        let isListening = false;
        let hideTimeout;

        // Configure recognition
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        recognition.maxAlternatives = 1;

        // Load saved settings
        loadSettings();

        // Check if settings mode
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('settings')) {
            settingsOverlay.classList.add('show');
            statusText.textContent = 'Settings Mode';
            statusDot.classList.add('ready');
        } else {
            // Auto-start after 2 seconds
            setTimeout(() => {
                startRecognition();
            }, 2000);
        }

        // Settings event listeners
        languageSelect.addEventListener('change', (e) => {
            recognition.lang = e.target.value;
            saveSettings();
        });

        fontSizeRange.addEventListener('input', (e) => {
            const size = e.target.value + 'em';
            captionText.style.fontSize = size;
            fontSizeValue.textContent = size;
            saveSettings();
        });

        bgOpacityRange.addEventListener('input', (e) => {
            const opacity = e.target.value / 100;
            captionBox.style.background = `rgba(0, 0, 0, ${opacity})`;
            bgOpacityValue.textContent = e.target.value + '%';
            saveSettings();
        });

        maxWidthRange.addEventListener('input', (e) => {
            captionBox.style.maxWidth = e.target.value + '%';
            maxWidthValue.textContent = e.target.value + '%';
            saveSettings();
        });

        startBtnSettings.addEventListener('click', () => {
            settingsOverlay.classList.remove('show');
            startRecognition();
        });

        closeBtnSettings.addEventListener('click', () => {
            settingsOverlay.classList.remove('show');
        });

        function startRecognition() {
            try {
                recognition.start();
                isListening = true;
                statusDot.classList.add('listening');
                statusText.textContent = 'Listening...';
            } catch (error) {
                console.error('Failed to start recognition:', error);
                showError('Failed to start speech recognition');
            }
        }

        // Handle results
        recognition.onresult = (event) => {
            let currentText = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;
                currentText += transcript + ' ';
            }

            updateCaption(currentText.trim());
        };

        // Update caption display
        function updateCaption(text) {
            if (!text) {
                hideCaption();
                return;
            }

            captionText.textContent = text;
            captionBox.classList.add('show');

            // Clear existing timeout
            if (hideTimeout) {
                clearTimeout(hideTimeout);
            }

            // Hide caption after 3 seconds of no new text
            hideTimeout = setTimeout(() => {
                hideCaption();
            }, 3000);
        }

        function hideCaption() {
            captionBox.classList.remove('show');
            captionText.textContent = '';
        }

        // Handle errors
        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            
            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                showError('Microphone access denied. Please allow microphone access in your browser settings.');
            } else if (event.error === 'no-speech') {
                // Ignore no-speech errors, this is normal
                return;
            } else if (event.error === 'network') {
                showError('Network error. Please check your internet connection.');
            } else {
                statusText.textContent = `Error: ${event.error}`;
            }
        };

        // Handle end
        recognition.onend = () => {
            if (isListening) {
                // Auto-restart if still listening
                try {
                    recognition.start();
                } catch (e) {
                    console.log('Failed to restart:', e);
                    setTimeout(() => {
                        try {
                            recognition.start();
                        } catch (err) {
                            showError('Speech recognition stopped. Please refresh the page.');
                        }
                    }, 1000);
                }
            }
        };

        // Handle start
        recognition.onstart = () => {
            statusDot.classList.add('listening');
            statusDot.classList.remove('ready');
            statusText.textContent = 'Listening...';
        };

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            statusText.textContent = 'Error';
            statusDot.classList.remove('listening', 'ready');
        }

        function saveSettings() {
            const settings = {
                language: languageSelect.value,
                fontSize: fontSizeRange.value,
                bgOpacity: bgOpacityRange.value,
                maxWidth: maxWidthRange.value
            };
            localStorage.setItem('captionSettings', JSON.stringify(settings));
        }

        function loadSettings() {
            const saved = localStorage.getItem('captionSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                
                languageSelect.value = settings.language || 'en-US';
                recognition.lang = settings.language || 'en-US';
                
                if (settings.fontSize) {
                    fontSizeRange.value = settings.fontSize;
                    captionText.style.fontSize = settings.fontSize + 'em';
                    fontSizeValue.textContent = settings.fontSize + 'em';
                }
                
                if (settings.bgOpacity) {
                    bgOpacityRange.value = settings.bgOpacity;
                    captionBox.style.background = `rgba(0, 0, 0, ${settings.bgOpacity / 100})`;
                    bgOpacityValue.textContent = settings.bgOpacity + '%';
                }
                
                if (settings.maxWidth) {
                    maxWidthRange.value = settings.maxWidth;
                    captionBox.style.maxWidth = settings.maxWidth + '%';
                    maxWidthValue.textContent = settings.maxWidth + '%';
                }
            }
        }

        // Keyboard shortcuts (for OBS interaction window)
        document.addEventListener('keydown', (e) => {
            // Press 'S' to show settings
            if (e.key === 's' || e.key === 'S') {
                settingsOverlay.classList.toggle('show');
            }
            // Press 'R' to restart
            if (e.key === 'r' || e.key === 'R') {
                recognition.stop();
                setTimeout(() => startRecognition(), 500);
            }
            // Press 'H' to hide status indicator
            if (e.key === 'h' || e.key === 'H') {
                const indicator = document.getElementById('statusIndicator');
                indicator.style.display = indicator.style.display === 'none' ? 'flex' : 'none';
            }
        });
    </script>
</body>
</html>
